spring.application.name=nutrivida-backend
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nutrivida?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.jwt.secret=${JWT_SECRET:bnV0cml2aWRhLWRldmVsb3BtZW50LXNlY3JldC1rZXktMzItYnl0ZXMtbG9uZy0yMDI2}
app.jwt.expiration=86400000
springdoc.swagger-ui.path=/swagger-ui.html
